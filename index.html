<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModularityKit.Mutator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --card: #ffffff;
      --border: #d9dee7;
      --text: #122033;
      --muted: #5b6778;
      --accent: #143a5a;
      --accent-strong: #0d2940;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(18, 32, 51, 0.04);
      overflow: hidden;
    }

    .hero__banner {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero__body {
      padding: 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      line-height: 1.1;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.55;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .links {
      display: grid;
      gap: 8px;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover,
    .links a:focus {
      color: var(--accent-strong);
      text-decoration: underline;
    }

    @media (max-width: 720px) {
      .page {
        padding: 16px 12px 32px;
      }

      .hero__body {
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <img class="hero__banner" src="assets/brand/mutator-landing-banner.png" alt="ModularityKit.Mutator">
      <div class="hero__body">
        <h1>ModularityKit.Mutator</h1>
        <p>Mutation runtime, governance, and generated API reference for .NET.</p>
        <div class="links">
          <a href="Docs/Home.html">Open documentation site</a>
          <a href="Docs/API/Reference.html">Open API reference</a>
        </div>
      </div>
    </section>

    <section class="grid" aria-label="Documentation sections">
      <article class="card">
        <h2>Packages</h2>
        <div class="links">
          <a href="src/README.html">ModularityKit.Mutator</a>
          <a href="src/Governance/README.html">ModularityKit.Mutator.Governance</a>
          <a href="src/Redis/README.html">ModularityKit.Mutator.Governance.Redis</a>
        </div>
      </article>

      <article class="card">
        <h2>Guides</h2>
        <div class="links">
          <a href="Docs/Core-Concepts.html">Core concepts</a>
          <a href="Docs/ExecutionModel.html">Execution model</a>
          <a href="Docs/Roadmap.html">Roadmap</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
