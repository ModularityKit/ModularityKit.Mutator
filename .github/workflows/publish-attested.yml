name: Publish Attested

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading "v"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Release version without the leading "v"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      package_version: ${{ inputs.version }}

  release:
    name: Upload artifacts to draft release
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download published artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: ModularityKit-packages
          path: dist
          merge-multiple: true

      - name: Attest package artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.nupkg

      - name: Upload artifacts to release
        if: ${{ inputs.version != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DIST_DIR: dist
          RELEASE_TAG: ${{ inputs.version }}
          ASSET_PATTERNS: |
            *
        run: python3 -m scripts.releases.upload_release_assets

      - name: Skip release upload
        if: ${{ inputs.version == '' }}
        run: echo "No version supplied; attested artifacts were produced without release upload."
