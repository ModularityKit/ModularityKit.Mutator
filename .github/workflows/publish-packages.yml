name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading "v"
        required: false
        type: string
      core_version:
        description: Optional manual version for ModularityKit.Mutator
        required: false
        type: string
      governance_version:
        description: Optional manual version for ModularityKit.Mutator.Governance
        required: false
        type: string
      redis_version:
        description: Optional manual version for ModularityKit.Mutator.Governance.Redis
        required: false
        type: string
      publish_core:
        description: Publish ModularityKit.Mutator
        required: false
        default: true
        type: boolean
      publish_governance:
        description: Publish ModularityKit.Mutator.Governance
        required: false
        default: true
        type: boolean
      publish_redis:
        description: Publish ModularityKit.Mutator.Governance.Redis
        required: false
        default: true
        type: boolean
      publish_nuget:
        description: Publish to NuGet.org
        required: false
        default: false
        type: boolean
      publish_github_packages:
        description: Publish to GitHub Packages
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Release version without the leading "v"
        required: false
        type: string
      core_version:
        description: Optional manual version for ModularityKit.Mutator
        required: false
        type: string
      governance_version:
        description: Optional manual version for ModularityKit.Mutator.Governance
        required: false
        type: string
      redis_version:
        description: Optional manual version for ModularityKit.Mutator.Governance.Redis
        required: false
        type: string
      publish_core:
        description: Publish ModularityKit.Mutator
        required: false
        type: boolean
        default: true
      publish_governance:
        description: Publish ModularityKit.Mutator.Governance
        required: false
        type: boolean
        default: true
      publish_redis:
        description: Publish ModularityKit.Mutator.Governance.Redis
        required: false
        type: boolean
        default: true
      publish_nuget:
        description: Publish to NuGet.org
        required: false
        default: false
        type: boolean
      publish_github_packages:
        description: Publish to GitHub Packages
        required: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  package:
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      package_version: ${{ inputs.version }}
      core_version: ${{ inputs.core_version }}
      governance_version: ${{ inputs.governance_version }}
      redis_version: ${{ inputs.redis_version }}
      publish_core: ${{ inputs.publish_core }}
      publish_governance: ${{ inputs.publish_governance }}
      publish_redis: ${{ inputs.publish_redis }}

  publish-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: package
    if: ${{ inputs.publish_nuget != false }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: ModularityKit-packages
          path: dist
          merge-multiple: true

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Push packages to NuGet.org
        run: |
          if [ -z "${{ secrets.NUGET_USERNAME }}" ]; then
            echo "NUGET_USERNAME secret is required to publish to NuGet.org with Trusted Publishing." >&2
            exit 1
          fi

          for package in dist/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: package
    if: ${{ inputs.publish_github_packages != false }}

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v6
        with:
          pattern: ModularityKit-packages
          path: dist
          merge-multiple: true

      - name: Push packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          for package in dist/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$GITHUB_TOKEN" \
              --source "https://nuget.pkg.github.com/${GITHUB_OWNER}/index.json" \
              --skip-duplicate
          done
